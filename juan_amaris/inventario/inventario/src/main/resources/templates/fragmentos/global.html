<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img th:src="@{/img/icono.png}" class="icono1" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Inventario
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/productos}">Productos</a></li>
                        <li><a class="dropdown-item" href="#">Otras acciones...</a></li>
                    </ul>
                    </li>
                </ul>
                </div>
                <div class="d-flex ms-auto align-items-center">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" th:if="${#authentication==null}" th:href="@{/login}">Login</a>
                            <form th:if="${#authentication!=null}" th:action="@{/logout}" method="POST" class="d-inline">
                                <button type="submit" class="nav-link border-0 bg-transparent">Logout</button>
                            </form>
                        </li>
                        <li class="nav-item">
                            <span class="navbar-text ms-2" th:if="${#authentication!=null}">Usuario: <b th:text="${#authentication.name}"></b></span>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-5"></div>

    <footer class="container mt-3" th:fragment="footer">
        <hr />
        <div class="d-flex align-items-center">
            <img th:src="@{/img/icono.png}" class="float-start icono2 me-2"/>
            <p class="mt-2" style="font-size: 0.85em">
                Este proyecto fue desarrollado con Java, Spring Framework... Security &amp; MySQL<br>
                Para el parcial 2 de Desarrollo Web 2. &copy; DW2 2025-2.
                Todos los derechos reservados, términos de uso y privacidad.     
            </p>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </footer>           
</body>
