spring.application.name=inmobiliaria

# Base de datos por defecto: H2 en archivo (no necesita instalar nada).
# Para usar MySQL ejecuta con: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/inmobiliaria;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Las validaciones (@NotBlank, @NotNull...) se aplican en los formularios, no como NOT NULL en la base:
# así las columnas nuevas se pueden agregar a tablas con datos (ddl-auto=update) sin fallar.
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Fotos
app.uploads.dir=uploads
app.uploads.max-fotos=10
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Cargar inmuebles de ejemplo la primera vez
app.datos-demo=true

# Privacidad de la ubicación (consulta legal 001): zona pública aproximada
# 300 m: el mínimo recomendado por Argenis para ciudad (consulta 001: 300 a 500 m). No bajar de aquí.
# El desplazamiento máximo debe ser menor que el radio.
app.privacidad.radio-zona-m=300
app.privacidad.desplazamiento-min-m=80
app.privacidad.desplazamiento-max-m=220

# Reportes (consulta legal 003)
app.reportes.max-por-dia=5
app.reportes.umbral-ocultar=3
# Nombre del portal en el mensaje inicial de WhatsApp
app.nombre-portal=Nidal Inmuebles

# Correo (Brevo, SMTP). Las credenciales NO van aquí: van en el archivo .env de esta carpeta
# (ver .env.example) o como variables de entorno. Sin credenciales, el portal no envía correos:
# escribe el enlace en la consola (modo desarrollo).
spring.config.import=optional:file:.env[.properties]
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USUARIO:}
spring.mail.password=${BREVO_SMTP_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Verifica que el certificado sea de verdad de Brevo (recomendación de JDoor).
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Remitente: debe estar verificado en Brevo (idealmente con el dominio propio).
app.correo.remitente=${APP_CORREO_REMITENTE:no-responder@nidalinmuebles.com}
app.correo.nombre-remitente=Nidal Inmuebles
# Dirección pública del portal para armar los enlaces de los correos (nunca se toma del navegador).
app.url-base=${APP_URL_BASE:http://localhost:8080}

# Recuperación de contraseña
app.recuperacion.minutos-vigencia=30
app.recuperacion.max-por-hora=3
