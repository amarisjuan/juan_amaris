spring.application.name=inmobiliaria

# Base de datos por defecto: H2 en archivo (no necesita instalar nada).
# Para usar MySQL ejecuta con: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/inmobiliaria;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fotos
app.uploads.dir=uploads
app.uploads.max-fotos=10
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Cargar inmuebles de ejemplo la primera vez
app.datos-demo=true

# Privacidad de la ubicación (consulta legal 001): zona pública aproximada
app.privacidad.radio-zona-m=400
app.privacidad.desplazamiento-min-m=100
app.privacidad.desplazamiento-max-m=300
