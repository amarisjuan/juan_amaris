<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Buscar inmuebles')}"></head>
<body>
<header th:replace="~{fragmentos/base :: menu}"></header>
<main>
    <section class="portada">
        <h1>Encuentra tu próximo hogar en Colombia</h1>
        <p>Arriendos y ventas publicados directamente por sus dueños.</p>
    </section>

    <form class="filtros" th:action="@{/}" method="get" th:object="${filtro}">
        <select th:field="*{operacion}">
            <option value="">Arriendo o venta</option>
            <option th:each="o : ${operaciones}" th:value="${o}" th:text="${o.etiqueta}"></option>
        </select>
<select id="sel-ciudad" th:field="*{ciudad}">
            <option value="">Todo Colombia</option>
            <optgroup th:each="d : ${municipios}" th:label="${d.key}">
                <option th:each="m : ${d.value}" th:value="${m.nombre()}" th:text="${m.nombre()}"></option>
            </optgroup>
        </select>
        <select th:field="*{tipo}">
            <option value="">Tipo de inmueble</option>
            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.etiqueta}"></option>
        </select>
        <input type="text" th:field="*{texto}" list="lista-barrios" placeholder="Barrio o palabra clave">
        <datalist id="lista-barrios"></datalist>
        <input type="number" min="0" step="50000" th:field="*{precioMin}" placeholder="Precio mínimo">
        <input type="number" min="0" step="50000" th:field="*{precioMax}" placeholder="Precio máximo">
        <select th:field="*{habitacionesMin}">
            <option value="">Habitaciones</option>
            <option th:each="n : ${#numbers.sequence(1,5)}" th:value="${n}" th:text="${n} + '+'"></option>
        </select>
        <select th:field="*{estrato}">
            <option value="">Estrato</option>
            <option th:each="n : ${#numbers.sequence(1,6)}" th:value="${n}" th:text="'Estrato ' + ${n}"></option>
        </select>
        <select id="sel-universidad" th:field="*{universidad}">
            <option value="">Primero elige la ciudad</option>
            <option th:each="u : ${universidadesFiltro}" th:value="${u.id}" th:text="${u.nombreCorto}"></option>
        </select>
        <select th:field="*{maxMinutos}">
            <option value="">Distancia a pie</option>
            <option value="5">Hasta 5 min</option>
            <option value="10">Hasta 10 min</option>
            <option value="15">Hasta 15 min</option>
            <option value="30">Hasta 30 min</option>
        </select>
        <select th:field="*{para}">
            <option value="">Vivienda para…</option>
            <option value="MUJER">Para mujer</option>
            <option value="HOMBRE">Para hombre</option>
        </select>
        <label class="check"><input type="checkbox" th:field="*{mascotas}" value="true"> Acepta mascotas</label>
        <label class="check"><input type="checkbox" th:field="*{amoblado}" value="true"> Amoblado</label>
        <label class="check"><input type="checkbox" th:field="*{serviciosIncluidos}" value="true"> Servicios incluidos</label>
        <select th:field="*{orden}">
            <option value="recientes">Más recientes</option>
            <option value="cercania">Más cerca a la universidad</option>
            <option value="precio_asc">Menor precio</option>
            <option value="precio_desc">Mayor precio</option>
        </select>
        <button type="submit" class="boton">Buscar</button>
        <a th:href="@{/}" class="limpiar">Limpiar</a>
    </form>

    <p class="conteo">
        <span th:text="${resultados.totalElements} + (${resultados.totalElements == 1} ? ' inmueble encontrado' : ' inmuebles encontrados')"></span>
        <span th:if="${universidadElegida}" th:text="'cerca a ' + ${universidadElegida.nombre}"></span>
    </p>

    <div id="mapa-resultados" class="mapa" th:if="${!puntosInmuebles.empty or puntoUniversidad != null}"></div>
    <script th:inline="javascript" th:if="${!puntosInmuebles.empty or puntoUniversidad != null}">
        (() => {
            const inmuebles = /*[[${puntosInmuebles}]]*/ [];
            const uni = /*[[${puntoUniversidad}]]*/ null;
            const mapa = Mapas.crear('mapa-resultados');
            const marcas = inmuebles.map(p => Mapas.zona(mapa, p));
            if (uni) marcas.push(Mapas.marcar(mapa, uni, 'uni', { zIndexOffset: 1000 }));
            Mapas.ajustar(mapa, marcas);
        })();
    </script>

    <div class="rejilla">
        <th:block th:each="i : ${resultados.content}">
            <a th:replace="~{fragmentos/base :: tarjeta(${i})}"></a>
        </th:block>
    </div>
    <p class="vacio" th:if="${resultados.empty}">No hay inmuebles con esos filtros. Prueba quitando alguno.</p>

    <nav class="paginas" th:if="${resultados.totalPages > 1}">
        <a th:if="${resultados.hasPrevious()}" th:href="@{${urlPaginas + (resultados.number - 1)}}">← Anterior</a>
        <span th:text="'Página ' + ${resultados.number + 1} + ' de ' + ${resultados.totalPages}"></span>
        <a th:if="${resultados.hasNext()}" th:href="@{${urlPaginas + (resultados.number + 1)}}">Siguiente →</a>
    </nav>
<script th:src="@{/js/geo.js}"></script>
<script th:inline="javascript">
    Geo.enlazar({
        ciudad: document.getElementById('sel-ciudad'),
        universidad: document.getElementById('sel-universidad'),
        listaBarrios: document.getElementById('lista-barrios'),
        universidades: /*[[${universidadesGeo}]]*/ {},
        barrios: /*[[${barriosGeo}]]*/ {},
        textoVacio: 'Cerca a universidad (opcional)'
    });
</script>
</main>
<footer th:replace="~{fragmentos/base :: pie}"></footer>
</body>
</html>
