<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Mis inmuebles')}"></head>
<body>
<header th:replace="~{fragmentos/base :: menu}"></header>
<main>
    <h1>Mis inmuebles</h1>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>
    <p th:if="${inmuebles.empty}" class="vacio">Aún no has publicado nada.
        <a th:href="@{/publicar}">Publica tu primer inmueble</a>.</p>

    <table class="tabla" th:unless="${inmuebles.empty}">
        <thead><tr><th>Inmueble</th><th>Precio</th><th>Estado</th><th></th></tr></thead>
        <tbody>
        <tr th:each="i : ${inmuebles}">
            <td><a th:href="@{/inmuebles/{id}(id=${i.id})}" th:text="${i.titulo}"></a><br>
                <small th:text="${i.operacion.etiqueta} + ' · ' + ${i.ciudad}"></small></td>
            <td>$<span th:text="${#numbers.formatInteger(i.precio, 1, 'POINT')}"></span></td>
            <td th:text="${i.activo ? 'Publicado' : 'Pausado'}"></td>
            <td class="acciones">
                <a th:href="@{/inmuebles/{id}/editar(id=${i.id})}">Editar</a>
                <form th:action="@{/inmuebles/{id}/estado(id=${i.id})}" method="post" class="en-linea">
                    <button class="enlace" th:text="${i.activo ? 'Pausar' : 'Activar'}"></button></form>
                <form th:action="@{/inmuebles/{id}/eliminar(id=${i.id})}" method="post" class="en-linea"
                      onsubmit="return confirm('¿Eliminar este inmueble?')">
                    <button class="enlace peligro">Eliminar</button></form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2>Mis publicaciones de compañero de cuarto</h2>
    <p th:if="${misCompaneros.empty}" class="ayuda">No tienes publicaciones.
        <a th:href="@{/companeros/nuevo}">Busca compañero de cuarto</a>.</p>
    <table class="tabla" th:unless="${misCompaneros.empty}">
        <thead><tr><th>Publicación</th><th>Estado</th><th></th></tr></thead>
        <tbody>
        <tr th:each="c : ${misCompaneros}">
            <td><span th:text="${c.tipo.etiqueta}"></span><br>
                <small th:text="${c.universidad.nombreCorto} + ' · ' + ${c.carrera}"></small></td>
            <td th:text="${c.activo ? 'Publicado' : 'Pausado'}"></td>
            <td class="acciones">
                <form th:action="@{/companeros/{id}/estado(id=${c.id})}" method="post" class="en-linea">
                    <button class="enlace" th:text="${c.activo ? 'Pausar' : 'Activar'}"></button></form>
                <form th:action="@{/companeros/{id}/eliminar(id=${c.id})}" method="post" class="en-linea"
                      onsubmit="return confirm('¿Eliminar esta publicación?')">
                    <button class="enlace peligro">Eliminar</button></form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
