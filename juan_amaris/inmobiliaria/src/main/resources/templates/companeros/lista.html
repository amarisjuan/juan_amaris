<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/base :: head('Busco compañero de cuarto')}"></head>
<body>
<header th:replace="~{fragmentos/base :: menu}"></header>
<main>
    <section class="portada">
        <h1><svg th:replace="~{fragmentos/base :: ic('personas')}"></svg> Busco compañero de cuarto</h1>
        <p>Encuentra con quién vivir cerca a tu universidad y divide los gastos.</p>
        <p><a class="boton acento" th:href="@{/companeros/nuevo}">Publicar mi perfil</a></p>
    </section>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <form class="filtros" th:action="@{/companeros}" method="get" th:object="${filtro}">
        <select id="sel-ciudad" th:field="*{ciudad}">
            <option value="">Todo Colombia</option>
            <optgroup th:each="d : ${municipios}" th:label="${d.key}">
                <option th:each="m : ${d.value}" th:value="${m.nombre()}" th:text="${m.nombre()}"></option>
            </optgroup>
        </select>
        <select id="sel-universidad" th:field="*{universidad}">
            <option value="">Universidad</option>
            <option th:each="u : ${universidadesFiltro}" th:value="${u.id}" th:text="${u.nombreCorto}"></option>
        </select>
        <select th:field="*{tipo}">
            <option value="">Todas las publicaciones</option>
            <option th:each="t : ${tiposBusqueda}" th:value="${t}" th:text="${t.etiqueta}"></option>
        </select>
        <select th:field="*{soy}">
            <option value="">Soy…</option>
            <option th:each="g : ${generos}" th:value="${g}" th:text="${g.etiqueta}"></option>
        </select>
        <input type="number" min="0" step="50000" th:field="*{presupuestoMax}" placeholder="Presupuesto máximo">
        <div class="acciones-filtro">
            <a th:href="@{/companeros}" class="limpiar">Limpiar</a>
            <button type="submit" class="boton">Buscar</button>
        </div>
    </form>

    <div th:replace="~{fragmentos/base :: antiestafa}"></div>

    <p class="conteo" th:text="${resultados.totalElements} + (${resultados.totalElements == 1} ? ' publicación' : ' publicaciones')"></p>

    <div class="rejilla">
        <article class="tarjeta companero" th:each="c : ${resultados.content}">
            <div class="cuerpo">
                <span class="etiqueta" th:classappend="${c.tipo.name() == 'TENGO_CUARTO'} ? '' : 'acento'"
                      th:text="${c.tipo.etiqueta}"></span>
                <h3 th:text="${c.autor.nombrePublico}"></h3>
                <p class="estudiante"><svg th:replace="~{fragmentos/base :: ic('gorro')}"></svg> <strong th:text="${c.universidad.nombreCorto}"></strong>
                    <span th:text="${c.carrera} + (${c.semestre} != null ? ', semestre ' + ${c.semestre} : '')"></span></p>
                <p class="datos">
                    <span th:text="${c.genero.etiqueta}"></span>
                    <span th:text="${c.buscoGenero == null ? 'Busca: mujer u hombre' : 'Busca: ' + c.buscoGenero.etiqueta.toLowerCase()}"></span>
                    <span th:if="${c.ciudadOrigen}" th:text="'De ' + ${c.ciudadOrigen}"></span>
                </p>
                <p class="precio">$<span th:text="${#numbers.formatInteger(c.presupuesto, 1, 'POINT')}"></span>
                    <small th:text="${c.tipo.name() == 'TENGO_CUARTO' ? '/mes el cuarto' : '/mes de presupuesto'}"></small></p>
                <p class="ubicacion" th:if="${c.barrio}"><svg th:replace="~{fragmentos/base :: ic('pin')}"></svg> <span th:text="${c.barrio} + ', ' + ${c.universidad.ciudad}"></span></p>
                <p class="descripcion corta" th:text="${c.descripcion}"></p>
                <a sec:authorize="isAuthenticated()" class="boton whatsapp"
                   th:href="@{/contacto/companero/{id}/whatsapp(id=${c.id})}">Escribir por WhatsApp</a>
                <a sec:authorize="isAuthenticated()" class="reportar" th:href="@{/reportar(objetivo='COMPANERO', id=${c.id})}">
                    <svg th:replace="~{fragmentos/base :: ic('bandera')}"></svg> Reportar</a>
                <a sec:authorize="!isAuthenticated()" class="boton secundario" th:href="@{/login}">
                    Inicia sesión para contactar</a>
            </div>
        </article>
    </div>
    <p class="vacio" th:if="${resultados.empty}">Aún no hay publicaciones con esos filtros.
        <a th:href="@{/companeros/nuevo}">¡Sé el primero!</a></p>

    <nav class="paginas" th:if="${resultados.totalPages > 1}">
        <a th:if="${resultados.hasPrevious()}" th:href="@{${urlPaginas + (resultados.number - 1)}}">← Anterior</a>
        <span th:text="'Página ' + ${resultados.number + 1} + ' de ' + ${resultados.totalPages}"></span>
        <a th:if="${resultados.hasNext()}" th:href="@{${urlPaginas + (resultados.number + 1)}}">Siguiente →</a>
    </nav>
<script th:src="@{/js/geo.js}"></script>
<script th:inline="javascript">
    Geo.enlazar({
        ciudad: document.getElementById('sel-ciudad'),
        universidad: document.getElementById('sel-universidad'),
        universidades: /*[[${universidadesGeo}]]*/ {},
        textoVacio: 'Cualquier universidad'
    });
</script>
</main>
<footer th:replace="~{fragmentos/base :: pie}"></footer>
</body>
</html>
